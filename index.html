<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Vital Sign Simulator (VVSS) | Patient Monitor</title>
    <meta name="description" content="Free web-based virtual vital sign and patient monitor simulator for medical education, nursing simulation, and clinical training. Real-time ECG, SpO2, Capnography, and NBP parameters.">
    
    <!-- 🟢 Firebase SDK 및 QR 라이브러리 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            position: relative;
            user-select: none;
        }

        /* 🟢 모니터 껍데기 */
        #monitor-wrapper {
            position: absolute; 
            left: 2vw; 
            top: 3vh;
            width: calc(75vh * 1.3); 
            min-width: 260px;
            max-width: 98vw;
            aspect-ratio: 1.3; 
            background-image: url('empty monitor.png'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border-radius: 20px;
            z-index: 10;
            touch-action: none;
        }

        #monitor-handle {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            height: 12%; 
            cursor: move;
            z-index: 80;
        }

        .resizer-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 28px;
            height: 28px;
            cursor: nwse-resize;
            z-index: 250;
            touch-action: none;
        }
        .resizer-handle::after {
            content: '';
            position: absolute;
            right: 6px;
            bottom: 6px;
            width: 10px;
            height: 10px;
            border-right: 3px solid rgba(255, 255, 255, 0.7);
            border-bottom: 3px solid rgba(255, 255, 255, 0.7);
        }

        #power-btn-overlay {
            position: absolute;
            bottom: 3.5%;  
            left: 5.5%;    
            width: 7%;     
            height: 9%;    
            border-radius: 50%; 
            cursor: pointer; 
            z-index: 200;
        }

        #mute-btn-overlay {
            position: absolute;
            bottom: 4%;  
            left: 18%; 
            width: 6%;     
            height: 8%;    
            border-radius: 50%; 
            cursor: pointer; 
            z-index: 200;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #444;
            padding-bottom: 5px;
            margin-bottom: 5px;
            cursor: move;
            flex-wrap: wrap;
            gap: 4px;
        }

        .panel-title {
            font-size: 14px; 
            font-weight: bold; 
            color: #ffffff; 
            letter-spacing: 0.5px; 
            margin: 0;
        }

        .panel-top-btn {
            border: none;
            padding: 3px 5px;
            border-radius: 4px;
            font-size: 10.5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .panel-top-btn:hover { filter: brightness(1.2); }

        .min-btn {
            background: #3a3a3a;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 4px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            line-height: 1;
            padding: 0;
        }
        .min-btn:hover {
            background: #555;
            color: #fff;
        }

        #monitor {
            position: absolute;
            top: 11%;    
            left: 4.5%;   
            width: 91%;  
            height: 74%; 
            background-color: #000; 
            display: flex;
            flex-direction: row; 
            border-radius: 6px;
            z-index: 5;
            overflow: hidden;
            container-type: size;
        }

        #mute-message {
            position: absolute;
            top: 3cqh;
            right: 3cqw;
            color: #ff3333;
            font-size: 3.5cqh;
            font-weight: bold;
            letter-spacing: 1px;
            display: none; 
            z-index: 60;
            animation: textBlink 1.5s infinite; 
        }

        @keyframes textBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #waveforms {
            flex: 1; 
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .wave-container {
            flex: 1 1 0;     
            min-height: 0;    
            position: relative;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15); 
        }
        .wave-container:last-child {
            border-bottom: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .wave-label {
            position: absolute;
            top: 1cqh;
            left: 2cqw;
            font-size: 3cqh !important;
            font-weight: bold;
        }
        
        .ecg-color { color: #00ff00; }
        .spo2-color { color: #00ffff; }
        .etco2-color { color: #ffffff; }
        .rr-color { color: #cccccc; }
        .bt-color { color: #ffff00; }

        #values {
            width: 23%; 
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 10, 0.9);
            padding: 1.5%;
            gap: 1.5%; 
            box-sizing: border-box;
            border-left: 2px solid #222;
        }

        .val-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; 
            background-color: #111;
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 8px; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: border-color 0.2s, background-color 0.2s;
        }
        
        .val-box:hover { border-color: rgba(255, 255, 255, 0.4); }

        .val-number { font-size: 9cqh !important; font-weight: bold; line-height: 1; text-align: center; }
        .val-title { font-size: 2.5cqh !important; font-weight: bold; margin-bottom: 0.5cqh; text-align: center; }

        #nbp-box-container .val-number { font-size: 7cqh !important; margin-top: 1cqh; }
        #nbp-box-container .val-mean { font-size: 5cqh !important; font-weight: bold; margin-top: 0.5cqh; }
        #box-val-bt {flex: 0.6;}        
        #box-val-bt .val-number { font-size: 6cqh !important; }

        .st-text { font-size: 3.2cqh; font-weight: bold; margin-top: 0.5cqh; }

        .scroll-val { cursor: ns-resize; transition: text-shadow 0.2s, color 0.2s; display: inline-block; }
        .scroll-val:hover { text-shadow: 0 0 15px rgba(255, 255, 255, 0.9); color: #ffffff !important; }

        .click-toggle { cursor: pointer; transition: text-shadow 0.2s, color 0.2s; display: inline-block; user-select: none; }
        .click-toggle:hover { color: #ffeb3b !important; text-shadow: 0 0 12px rgba(255, 235, 59, 0.8); }

        @keyframes alarmBlink {
            0% { background-color: rgba(255, 0, 0, 0); border-color: rgba(255, 255, 255, 0.15); }
            50% { background-color: rgba(255, 0, 0, 0.5); border-color: rgba(255, 0, 0, 1); box-shadow: inset 0 0 20px rgba(255,0,0,0.8); }
            100% { background-color: rgba(255, 0, 0, 0); border-color: rgba(255, 255, 255, 0.15); }
        }
        .alarm-active { animation: alarmBlink 2s ease-in-out 3; }
        .alarm-trigger { cursor: pointer; }
        #standby-btn { display: none; }

        /* 🟢 컨트롤 패널 */
        #controls {
            position: absolute; 
            right: 2vw; 
            top: 3vh;
            width: 390px; 
            min-width: 220px;
            max-width: 650px;
            background-color: #2a2a2a;
            padding: 8px 10px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
            max-height: 94vh;
            overflow-y: scroll !important; 
            overflow-x: hidden !important;
            -webkit-overflow-scrolling: touch;
            z-index: 15;
            touch-action: pan-y !important;
        }

        .controls-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .controls-col {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            min-width: 0;
        }

        .control-group { display: flex; flex-direction: column; width: 100%; gap: 1px; min-width: 0; }
        .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1px; }
        .input-row label { font-size: 9.5px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 🟢 컨트롤러 제목 라벨 알람 트리거 스타일 */
        .ctrl-title-btn {
            cursor: pointer;
            transition: 0.15s ease;
            user-select: none;
            padding: 1px 3px;
            border-radius: 3px;
        }
        .ctrl-title-btn:hover {
            filter: brightness(1.4);
            text-shadow: 0 0 6px currentColor;
            background: rgba(255,255,255,0.08);
        }
        .ctrl-title-btn:active {
            transform: scale(0.95);
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 2px;
            margin: 1px 0 2px 0;
            width: 100%;
            box-sizing: border-box;
        }
        .slider-row input[type="range"] {
            flex: 1;
            min-width: 0;
            margin: 0;
            cursor: pointer;
            height: 14px;
        }
        .step-btn {
            background: #444;
            color: #fff;
            border: none;
            border-radius: 3px;
            width: 18px;
            height: 18px;
            font-size: 11px;
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
            user-select: none;
        }
        .step-btn:hover { background: #666; }
        .step-btn:active { background: #888; }

        input[type="number"] {
            background-color: #111; color: #fff; border: 1px solid #555;
            padding: 1px 2px; border-radius: 3px; width: 32px;
            text-align: center; font-weight: bold; font-size: 10px;
            flex-shrink: 0;
        }

        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }

        .mode-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
            margin-bottom: 2px;
            gap: 2px;
            flex-wrap: nowrap;
        }

        .mode-row label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .condition-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 2px;
            margin-bottom: 2px;
        }

        .btn-cond {
            padding: 5px 3px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
        }

        .btn-cond-title { font-size: 10px; font-weight: bold; white-space: nowrap; }
        .btn-cond-desc { font-size: 8.5px; opacity: 0.85; font-weight: normal; letter-spacing: -0.3px; white-space: nowrap; }

        .btn-worsen { background-color: #8b0000; color: #ffcccc; }
        .btn-worsen:hover { background-color: #b22222; color: #ffffff; }

        .btn-improve { background-color: #005f73; color: #cceeff; }
        .btn-improve:hover { background-color: #0a9396; color: #ffffff; }

        /* 🟢 알람 한계치 설정 패널 스타일 (기본 접힘) */
        .alarm-limits-section {
            margin-top: 4px;
            padding: 5px 6px;
            background: rgba(0,0,0,0.35);
            border: 1px solid #444;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .alarm-limits-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #ff9800;
            cursor: pointer;
        }
        .alarm-limits-grid {
            display: none; 
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 2px;
        }
        .alarm-limit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e1e1e;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .alarm-limit-item label {
            font-size: 9px;
            font-weight: bold;
        }
        .alarm-limit-inputs {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .alarm-limit-inputs input {
            width: 32px !important;
            padding: 1px !important;
            font-size: 9.5px !important;
            cursor: ns-resize;
        }

        /* 🟢 [Scenario Preset Management] 섹션 스타일 */
        .scenario-section {
            margin-top: 6px;
            padding: 8px;
            background: #1d1d1d;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .scenario-header {
            font-size: 12px;
            font-weight: bold;
            color: #e6db00;
            text-align: left;
            letter-spacing: 0.5px;
        }
        .preset-top-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            width: 100%;
        }
        #preset-set-select {
            flex: 1.5;
            min-width: 0;
            background-color: #111111;
            color: #ffea00;
            border: 1px solid #555555;
            border-radius: 5px;
            padding: 5px 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }
        .btn-preset-ctrl {
            background-color: #4f4f4f;
            color: #ffffff;
            border: 1px solid #777777;
            border-radius: 5px;
            padding: 5px 6px;
            font-size: 10.5px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.15s;
        }
        .btn-preset-ctrl:hover {
            background-color: #666666;
        }
        .btn-preset-ctrl.edit-active {
            background-color: #ff9800;
            color: #000000;
            border-color: #ffc107;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.6);
        }
        .preset-io-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
        }
        .btn-preset-import {
            background-color: #005b6e;
            color: #ffffff;
            border: 1px solid #148096;
            border-radius: 5px;
            padding: 7px 4px;
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-preset-import:hover {
            background-color: #00768f;
        }
        .btn-preset-export {
            background-color: #7a0000;
            color: #ffffff;
            border: 1px solid #a82020;
            border-radius: 5px;
            padding: 7px 4px;
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-preset-export:hover {
            background-color: #9c0000;
        }

        .scenario-divider {
            border-top: 1px solid #333;
            margin: 1px 0;
        }

        .scenario-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            min-height: 28px;
        }

        .btn-scenario {
            position: relative;
            background-color: #383838;
            color: #ffffff;
            border: 1px solid #5a5a5a;
            border-radius: 5px;
            padding: 6px 2px;
            font-size: 10.5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            white-space: nowrap;
            overflow: visible;
            text-overflow: ellipsis;
            user-select: none;
        }
        .btn-scenario span.phase-label {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 2px;
        }
        .btn-scenario:hover {
            background-color: #4d4d4d;
            border-color: #ffeb3b;
        }
        .btn-scenario:active {
            transform: scale(0.96);
        }
        .btn-scenario.active-phase {
            border-color: #ffeb3b;
            background-color: #4a4520;
            color: #ffeb3b;
            box-shadow: 0 0 6px rgba(255, 235, 59, 0.45);
        }
        .btn-scenario.edit-mode-item {
            border-style: dashed;
            border-color: #ff9800;
            cursor: grab;
        }
        .btn-scenario.edit-mode-item:active {
            cursor: grabbing;
        }
        .btn-scenario.dragging {
            opacity: 0.4;
            border-color: #00ffff;
        }
        .btn-scenario.drag-over {
            border: 2px solid #00ff00;
            transform: scale(1.04);
        }

        .phase-del-btn {
            position: absolute;
            top: -6px;
            left: -6px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: #d32f2f;
            color: #ffffff;
            border: 1px solid #ffffff;
            font-size: 9px;
            line-height: 13px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.7);
        }
        .phase-del-btn:hover {
            background-color: #ff1744;
            transform: scale(1.15);
        }

        /* 🟢 Save changes? (Yes / No) 커스텀 모달 스타일 */
        #save-confirm-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-card {
            background: #252525;
            border: 1px solid #666;
            border-radius: 10px;
            padding: 18px 22px;
            width: 280px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .modal-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }
        .modal-btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .modal-btn {
            padding: 8px 10px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal-btn-yes {
            background-color: #28a745;
            color: #ffffff;
        }
        .modal-btn-yes:hover { background-color: #218838; }
        .modal-btn-no {
            background-color: #dc3545;
            color: #ffffff;
        }
        .modal-btn-no:hover { background-color: #c82333; }

        /* 🟢 Apply & Reset 버튼 나란히 배치 */
        .action-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 2px;
        }

        #apply-btn {
            padding: 6px; font-size: 12px; background-color: #28a745; 
            color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }
        #apply-btn:hover { background-color: #218838; }

        #reset-btn {
            padding: 6px; font-size: 12px; background-color: #ffc107; 
            color: #000000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }
        #reset-btn:hover { background-color: #e0a800; }

        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center;
            align-items: center; z-index: 300;
        }

        #start-btn {
            padding: 12px 24px; font-size: 16px; background-color: #007bff;
            color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        #start-btn:hover { background-color: #0056b3; }
        
        #qr-container {
            position: absolute; bottom: 20px; left: 20px; width: 180px; min-width: 130px;
            max-width: 380px; background: rgba(20,20,20,0.95); padding: 10px 12px;
            border-radius: 12px; border: 1px solid #444; display: flex; flex-direction: column;
            z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); touch-action: none; box-sizing: border-box;
        }

        #qr-box {
            background: white; padding: 6px; border-radius: 6px; display: flex;
            justify-content: center; align-items: center; margin: 6px 0; width: 100%; box-sizing: border-box;
        }

        #qr-box img { width: 100% !important; height: auto !important; max-width: 100%; display: block; }

        .session-btn {
            background: #333; color: #4da3ff; border: 1px solid #555;
            border-radius: 4px; padding: 4px 6px; font-size: 11px; cursor: pointer;
            font-weight: bold; transition: 0.2s; width: 100%;
        }
        .session-btn:hover { background: #444; color: #fff; }

        /* 📱 모바일 화면 (폭 768px 이하) 전용 레이아웃 ('사진 2' 스타일) */
        @media (max-width: 768px) {
            #monitor-wrapper {
                left: 1vw;
                top: 1vh;
                width: 98vw;
                max-width: 98vw;
            }

            #controls {
                left: 0;
                right: 0;

                        if (confirm('Delete this phase?')) {
                            phases.splice(idx, 1);
                            if (activePhaseIndex === idx) activePhaseIndex = null;
                            else if (activePhaseIndex !== null && activePhaseIndex > idx) activePhaseIndex--;
                            renderPresetUI();
                        }
                    });
                    btn.appendChild(delBtn);

                    btn.draggable = true;
                    btn.addEventListener('dragstart', (e) => {
                        dragSrcIndex = idx;
                        btn.classList.add('dragging');
                        if (e.dataTransfer) {
                            e.dataTransfer.effectAllowed = 'move';
                            e.dataTransfer.setData('text/plain', String(idx));

                        btn.classList.add('drag-over');

                    btn.addEventListener('dragleave', () => {
                        btn.classList.remove('drag-over');
                    });
                    btn.addEventListener('drop', (e) => {
                        e.preventDefault();
                        btn.classList.remove('drag-over');
                        if (dragSrcIndex === null || dragSrcIndex === idx) return;

                        const movedItem = phases.splice(dragSrcIndex, 1)[0];
                        phases.splice(idx, 0, movedItem);

                        if (activePhaseIndex === dragSrcIndex) {
                            activePhaseIndex = idx;
                        } else if (activePhaseIndex !== null) {
                            if (dragSrcIndex < activePhaseIndex && idx >= activePhaseIndex) activePhaseIndex--;
                            else if (dragSrcIndex > activePhaseIndex && idx <= activePhaseIndex) activePhaseIndex++;
                        }
                        dragSrcIndex = null;
                        renderPresetUI();
                    });
                }

                presetDOM.phaseGrid.appendChild(btn);
            });
        }

        // 🟢 정상 범위 초과 감지 및 자동 알람 함수
        function checkAutoAlarms() {
            if (currentMonitorStatus !== 'running') return;
            const lim = state.limits || DEFAULT_INITIAL_STATE.limits;

            const isSysAbnormal = (state.sys < lim.sysLow || state.sys > lim.sysHigh);
            const isHrAbnormal = (state.hr < lim.hrLow || state.hr > lim.hrHigh);
            const isStDepAbnormal = (state.st <= lim.stDep);
            const isStElevAbnormal = (state.st >= lim.stElev);
            const isTInvAbnormal = Boolean(state.tWaveInverted);

            const isSpo2Abnormal = (state.spo2 < lim.spo2Low);
            const isEtco2Abnormal = (state.etco2 < lim.etco2Low || state.etco2 > lim.etco2High);
            const isRrAbnormal = (state.rr < lim.rrLow || state.rr > lim.rrHigh);
            const isBtAbnormal = (state.bt < lim.btLow || state.bt > lim.btHigh);
            const isRhythmAbnormal = (state.rhythm !== 'normal');

            if (isSysAbnormal && !lastAlarmStatus.sys) triggerManualAlarm(DOM.boxValNBP);
            
            const ecgNeedAlarm = (isHrAbnormal && !lastAlarmStatus.hr) ||
                                 (isStDepAbnormal && !lastAlarmStatus.stDep) ||
                                 (isStElevAbnormal && !lastAlarmStatus.stElev) ||
                                 (isTInvAbnormal && !lastAlarmStatus.tInv) ||
                                 (isRhythmAbnormal && !lastAlarmStatus.rhythm);

            if (ecgNeedAlarm) {
                triggerManualAlarm(DOM.boxValHR);
            }

            if (isSpo2Abnormal && !lastAlarmStatus.spo2) triggerManualAlarm(DOM.boxValSpO2);
            if (isEtco2Abnormal && !lastAlarmStatus.etco2) triggerManualAlarm(DOM.boxValEtCO2);
            if (isRrAbnormal && !lastAlarmStatus.rr) triggerManualAlarm(DOM.boxValRR);
            if (isBtAbnormal && !lastAlarmStatus.bt) triggerManualAlarm(DOM.boxValBT);

            lastAlarmStatus = {
                sys: isSysAbnormal,
                hr: isHrAbnormal,
                stDep: isStDepAbnormal,
                stElev: isStElevAbnormal,
                tInv: isTInvAbnormal,
                spo2: isSpo2Abnormal,
                etco2: isEtco2Abnormal,
                rr: isRrAbnormal,
                bt: isBtAbnormal,
                rhythm: isRhythmAbnormal
            };
        }

        // ==========================================
        // 2. 세션 연결 및 변경 관리
        // ==========================================
        function connectSession(newSessionId) {
            sessionId = newSessionId;
            if (DOM.sessionDisplay) DOM.sessionDisplay.innerText = sessionId;

            if (currentSessionRef) {
                currentSessionRef.off();
            }

            currentSessionRef = db.ref('sessions/' + sessionId);

            if (role !== 'controller') {
                currentSessionRef.set(state);
                renderQRCode();
            }

            currentSessionRef.child('alarmTrigger').on('value', (snap) => {
                const triggerData = snap.val();
                if (!triggerData || !triggerData.target) return;
                
                if (Date.now() - triggerData.timestamp < 3000) {
                    const targetBoxes = {
                        nbp: DOM.boxValNBP,
                        hr: DOM.boxValHR,
                        spo2: DOM.boxValSpO2,
                        etco2: DOM.boxValEtCO2,
                        rr: DOM.boxValRR,
                        bt: DOM.boxValBT
                    };
                    const targetEl = targetBoxes[triggerData.target];
                    if (targetEl) triggerManualAlarm(targetEl);
                }
            });

            currentSessionRef.on('value', (snapshot) => {
                if (snapshot.exists()) {
                    state = Object.assign(state, snapshot.val());
                    if (!state.limits) {
                        state.limits = JSON.parse(JSON.stringify(DEFAULT_INITIAL_STATE.limits));
                    }
                    updateDisplay();
                    
                    DOM.ctrlTWave.checked = !!state.tWaveInverted;
                    DOM.ctrlABP.checked = !!state.abpMode;
                    DOM.ctrlSelfBreathing.checked = !!state.selfBreathing;
                    DOM.ctrlDbpSync.checked = (state.dbpSync !== undefined) ? !!state.dbpSync : true;
                    DOM.ctrlRhythm.value = state.rhythm || 'normal';
                    DOM.ctrlEtco2Pattern.value = state.etco2Pattern || 'normal';
                    DOM.ctrlCleftDepth.value = state.cleftDepth || 0.4;
                    DOM.inCleftDepth.value = state.cleftDepth || 0.4;

                    if (DOM.ctrlVolume.value != state.volume) DOM.ctrlVolume.value = state.volume;

                    if(state.rhythm === 'vf' || state.rhythm === 'vt') {
                        DOM.rhythmLabel.innerText = state.rhythm.toUpperCase();
                    } else if(state.rhythm === 'afib') DOM.rhythmLabel.innerText = "A-Fib";
                    else if(state.rhythm === 'aflutter') DOM.rhythmLabel.innerText = "A-Flutter";
                    else DOM.rhythmLabel.innerText = "lead II";

                    const patternNames = {
                        normal: 'Normal', curare: 'Curare Cleft', ineffective: 'Ineffective Trigger',
                        autotrigger: 'Auto-Triggering', doubletrigger: 'Double Trigger',
                        fighting: 'Fighting', sharkfin: 'Shark Fin'
                    };
                    DOM.labelEtco2Type.innerText = patternNames[state.etco2Pattern] || 'Normal';

                    if (state.abpMode) {
                        DOM.labelWaveRR.innerText = "ABP"; DOM.labelWaveRR.style.color = "#ff0000"; 
                        DOM.labelNBPTitle.innerText = "ABP mmHg";
                    } else {
                        DOM.labelWaveRR.innerText = "Resp (RR)"; DOM.labelWaveRR.style.color = "#cccccc"; 
                        DOM.labelNBPTitle.innerText = "NBP mmHg (2.5mins)";
                    }

                    if (state.monitorStatus === 'running') {
                        if (currentMonitorStatus !== 'running') {
                            startMonitorLocal();
                        }
                    } else {
                        if (currentMonitorStatus !== 'standby') {
                            standbyMonitorLocal();
                        }
                    }

                    checkAutoAlarms();
                }
            });

            const newUrl = `${window.location.pathname}?session=${sessionId}${role ? '&role=' + role : ''}`;
            window.history.replaceState({}, '', newUrl);
        }

        function renderQRCode() {
            const qrBox = document.getElementById("qr-box");
            if (!qrBox) return;
            qrBox.innerHTML = '';
            const controllerUrl = `${window.location.origin}${window.location.pathname}?session=${sessionId}&role=controller`;
            const size = Math.max(80, qrBox.clientWidth - 12 || 120);
            qrCodeInstance = new QRCode(qrBox, { text: controllerUrl, width: size, height: size });
        }

        function promptChangeSession() {
            const input = prompt("변경할 Session ID를 입력하세요 (빈칸 입력 시 무작위 생성):", sessionId);
            if (input === null) return;
            const targetId = input.trim().toUpperCase() || Math.random().toString(36).substring(2, 8).toUpperCase();
            connectSession(targetId);
        }

        if (role === 'controller') {
            document.getElementById('monitor-wrapper').style.display = 'none';
            document.getElementById('qr-container').style.display = 'none';
            
            const ctrl = document.getElementById('controls');
            ctrl.style.position = 'fixed';
            ctrl.style.top = '0';
            ctrl.style.left = '0';
            ctrl.style.width = '100vw';
            ctrl.style.height = '100vh';
            ctrl.style.maxWidth = '100vw';
            ctrl.style.maxHeight = '100vh';
            ctrl.style.borderRadius = '0';
            ctrl.style.zIndex = '9999';
            ctrl.style.backgroundColor = '#1a1a1a';
            ctrl.style.padding = '6px 8px';
            ctrl.style.overflowY = 'scroll';
            ctrl.style.touchAction = 'pan-y';
            document.getElementById('controls-resizer').style.display = 'none';
            document.getElementById('ctrl-min-btn').style.display = 'none';
        }

        if (!sessionId) {
            sessionId = Math.random().toString(36).substring(2, 8).toUpperCase();
        }
        connectSession(sessionId);

        // ==========================================
        // 3. 화면 UI 표시 및 Apply 분리 로직
        // ==========================================
        function updateDisplay() {
            DOM.valBT.innerText = parseFloat(state.bt).toFixed(1);
            DOM.valHR.innerText = state.hr;
            DOM.valSpO2.innerText = state.spo2;
            DOM.valEtCO2.innerText = state.etco2;
            DOM.valRR.innerText = state.rr; 
            DOM.valSys.innerText = state.sys;
            DOM.valDia.innerText = state.dia;
            DOM.valST.innerText = parseFloat(state.st).toFixed(1);
            
            let sysValue = parseInt(state.sys);
            let diaValue = parseInt(state.dia);
            document.getElementById('val-mean').innerText = Math.round((sysValue + 2 * diaValue) / 3);
    
            const activeId = document.activeElement ? document.activeElement.id : '';
            const vitalInputIds = ['input-bt', 'input-hr', 'input-spo2', 'input-etco2', 'input-rr', 'input-sys', 'input-dia', 'input-st'];
            
            if (!vitalInputIds.includes(activeId)) {
                DOM.inBT.value = parseFloat(state.bt).toFixed(1);
                DOM.inHR.value = state.hr;
                DOM.inSpO2.value = state.spo2;
                DOM.inEtCO2.value = state.etco2;
                DOM.inRR.value = state.rr;
                DOM.inSys.value = state.sys;
                DOM.inDia.value = state.dia;
                DOM.inST.value = parseFloat(state.st).toFixed(1);

                DOM.ctrlBT.value = state.bt; 
                DOM.ctrlHR.value = state.hr;
                DOM.ctrlSpO2.value = state.spo2; 
                DOM.ctrlEtCO2.value = state.etco2;
                DOM.ctrlRR.value = state.rr; 
                DOM.ctrlSys.value = state.sys;
                DOM.ctrlDia.value = state.dia; 
                DOM.ctrlST.value = state.st;
            }

            DOM.ctrlDbpSync.checked = !!state.dbpSync;
            DOM.ctrlEtco2Pattern.value = state.etco2Pattern || 'normal';
            DOM.ctrlCleftDepth.value = state.cleftDepth || 0.4;
            DOM.inCleftDepth.value = state.cleftDepth || 0.4;
            DOM.groupCleftDepth.style.display = state.etco2Pattern === 'curare' ? 'flex' : 'none';

            if (state.limits) {
                DOM.limSysLow.value = state.limits.sysLow; DOM.limSysHigh.value = state.limits.sysHigh;
                DOM.limHrLow.value = state.limits.hrLow; DOM.limHrHigh.value = state.limits.hrHigh;
                DOM.limStDep.value = state.limits.stDep.toFixed(1); DOM.limStElev.value = state.limits.stElev.toFixed(1);
                DOM.limSpo2Low.value = state.limits.spo2Low;
                DOM.limEtco2Low.value = state.limits.etco2Low; DOM.limEtco2High.value = state.limits.etco2High;
                DOM.limRrLow.value = state.limits.rrLow; DOM.limRrHigh.value = state.limits.rrHigh;
                DOM.limBtLow.value = state.limits.btLow.toFixed(1); DOM.limBtHigh.value = state.limits.btHigh.toFixed(1);
            }

            if (muteMsg) muteMsg.style.display = state.isMuted ? 'block' : 'none';
            if (state.isMuted) {
                DOM.btnPanelMute.style.background = '#dc3545';
                DOM.btnPanelMute.innerText = 'Unmute';
            } else {
                DOM.btnPanelMute.style.background = '#6c757d';
                DOM.btnPanelMute.innerText = 'Mute';
            }
        }

        function syncToFirebase(updates) {
            if (currentSessionRef) currentSessionRef.update(updates);
        }

        function triggerManualAlarmRemote(targetKey) {
            const targetBoxes = {
                nbp: DOM.boxValNBP,
                hr: DOM.boxValHR,
                spo2: DOM.boxValSpO2,
                etco2: DOM.boxValEtCO2,
                rr: DOM.boxValRR,
                bt: DOM.boxValBT
            };
            const targetEl = targetBoxes[targetKey];
            if (targetEl) triggerManualAlarm(targetEl);

            if (currentSessionRef) {
                currentSessionRef.child('alarmTrigger').set({
                    target: targetKey,
                    timestamp: Date.now()
                });
            }
        }

        document.querySelectorAll('.ctrl-title-btn').forEach(label => {
            label.addEventListener('click', (e) => {
                e.stopPropagation();
                const targetKey = label.getAttribute('data-alarm-target');
                if (targetKey) {
                    triggerManualAlarmRemote(targetKey);
                }
            });
        });

        function applySysChange(newSys) {
            state.sys = Math.max(10, Math.min(300, newSys));
            if (state.dbpSync) {
                state.dia = Math.max(20, Math.min(180, Math.round(state.sys * 2 / 3)));
                DOM.ctrlDia.value = state.dia;
            }
        }

        function updateLocalControl(name, value, isFloat = false) {
            let val = isFloat ? parseFloat(value) : parseInt(value);
            if (isNaN(val)) return;

            const map = {
                sys: { input: DOM.inSys, slider: DOM.ctrlSys, min: 10, max: 300 },
                dia: { input: DOM.inDia, slider: DOM.ctrlDia, min: 20, max: 180 },
                hr:  { input: DOM.inHR,  slider: DOM.ctrlHR,  min: 20, max: 300 },
                st:  { input: DOM.inST,  slider: DOM.ctrlST,  min: -3.0, max: 6.0 },
                spo2:{ input: DOM.inSpO2,slider: DOM.ctrlSpO2,min: 20, max: 100 },
                etco2:{input: DOM.inEtCO2,slider: DOM.ctrlEtCO2,min: 1, max: 100 },
                rr:  { input: DOM.inRR,  slider: DOM.ctrlRR,  min: 2, max: 40 },
                bt:  { input: DOM.inBT,  slider: DOM.ctrlBT,  min: 30.0, max: 45.0 }
            };

            const item = map[name];
            if (!item) return;

            val = Math.max(item.min, Math.min(item.max, val));
            const formatted = isFloat ? val.toFixed(1) : Math.round(val);

            item.input.value = formatted;
            item.slider.value = formatted;

            if (name === 'sys' && DOM.ctrlDbpSync.checked) {
                const autoDia = Math.max(20, Math.min(180, Math.round(val * 2 / 3)));
                DOM.inDia.value = autoDia;
                DOM.ctrlDia.value = autoDia;
            }
        }

        function attachLimitInputEvent(inputElement, limitKey, isFloat = false) {
            inputElement.addEventListener('change', () => {
                const val = isFloat ? parseFloat(inputElement.value) : parseInt(inputElement.value);
                if (!isNaN(val)) {
                    if (!state.limits) state.limits = {};
                    state.limits[limitKey] = val;
                    syncToFirebase({ limits: state.limits });
                    checkAutoAlarms();
                }
            });
        }
        attachLimitInputEvent(DOM.limSysLow, 'sysLow'); attachLimitInputEvent(DOM.limSysHigh, 'sysHigh');
        attachLimitInputEvent(DOM.limHrLow, 'hrLow'); attachLimitInputEvent(DOM.limHrHigh, 'hrHigh');
        attachLimitInputEvent(DOM.limStDep, 'stDep', true); attachLimitInputEvent(DOM.limStElev, 'stElev', true);
        attachLimitInputEvent(DOM.limSpo2Low, 'spo2Low');
        attachLimitInputEvent(DOM.limEtco2Low, 'etco2Low'); attachLimitInputEvent(DOM.limEtco2High, 'etco2High');
        attachLimitInputEvent(DOM.limRrLow, 'rrLow'); attachLimitInputEvent(DOM.limRrHigh, 'rrHigh');
        attachLimitInputEvent(DOM.limBtLow, 'btLow', true); attachLimitInputEvent(DOM.limBtHigh, 'btHigh', true);

        document.querySelectorAll('.alarm-limit-inputs input').forEach(input => {
            input.addEventListener('wheel', function(e) {
                e.preventDefault();
                const direction = e.deltaY < 0 ? 1 : -1;
                const step = parseFloat(this.getAttribute('step')) || 1;
                let val = parseFloat(this.value);
                if (isNaN(val)) val = 0;
                
                let newValue = val + (direction * step);
                this.value = step < 1 ? newValue.toFixed(1) : Math.round(newValue);
                this.dispatchEvent(new Event('change'));
            }, { passive: false });
        });

        DOM.btnToggleLimits.addEventListener('click', () => {
            if (DOM.alarmLimitsBody.style.display === 'grid') {
                DOM.alarmLimitsBody.style.display = 'none';
                DOM.labelLimitsArrow.innerText = '▲';
            } else {
                DOM.alarmLimitsBody.style.display = 'grid';
                DOM.labelLimitsArrow.innerText = '▼';
            }
        });

        DOM.btnApply.addEventListener('click', () => {
            state.bt = parseFloat(DOM.inBT.value) || state.bt; 
            state.hr = parseInt(DOM.inHR.value) || state.hr;
            state.st = parseFloat(DOM.inST.value) || 0.0; 
            state.spo2 = parseInt(DOM.inSpO2.value) || state.spo2;
            state.etco2 = parseInt(DOM.inEtCO2.value) || state.etco2; 
            state.rr = parseInt(DOM.inRR.value) || state.rr;
            state.cleftDepth = parseFloat(DOM.inCleftDepth.value) || state.cleftDepth;
            state.dbpSync = DOM.ctrlDbpSync.checked;

            applySysChange(parseInt(DOM.inSys.value) || state.sys);
            if (!state.dbpSync) {
                state.dia = parseInt(DOM.inDia.value) || state.dia;
            }

            updateDisplay();
            updateActivePhaseVitalsIfSelected();
            syncToFirebase(state);
            checkAutoAlarms();
        });

        DOM.btnReset.addEventListener('click', () => {
            const currentStatus = state.monitorStatus;
            const currentVol = state.volume;
            const currentMuted = state.isMuted;

            state = JSON.parse(JSON.stringify(DEFAULT_INITIAL_STATE));
            state.monitorStatus = currentStatus;
            state.volume = currentVol;
            state.isMuted = currentMuted;

            activePhaseIndex = null;
            renderPresetUI();

            DOM.ctrlSelfBreathing.checked = state.selfBreathing;
            DOM.ctrlDbpSync.checked = state.dbpSync;
            DOM.ctrlTWave.checked = state.tWaveInverted;
            toggleABPMode(state.abpMode);

            updateDisplay();
            syncToFirebase(state);
            checkAutoAlarms();
        });

        DOM.btnWorsen.addEventListener('click', () => {
            applySysChange(parseInt(state.sys) - 5);
            state.hr = Math.max(20, Math.min(300, parseInt(state.hr) + 2));
            state.etco2 = Math.max(1, Math.min(100, parseInt(state.etco2) - 1));
            updateDisplay();
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({ sys: state.sys, dia: state.dia, hr: state.hr, etco2: state.etco2 });
            checkAutoAlarms();
        });

        DOM.btnImprove.addEventListener('click', () => {
            applySysChange(parseInt(state.sys) + 5);
            state.hr = Math.max(20, Math.min(300, parseInt(state.hr) - 2));
            state.etco2 = Math.max(1, Math.min(100, parseInt(state.etco2) + 1));
            updateDisplay();
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({ sys: state.sys, dia: state.dia, hr: state.hr, etco2: state.etco2 });
            checkAutoAlarms();
        });

        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') DOM.btnApply.click();
            });
        });

        document.querySelectorAll('.step-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const targetId = e.target.getAttribute('data-target');
                const step = parseFloat(e.target.getAttribute('data-step'));
                const slider = document.getElementById(targetId);
                const isPlus = e.target.classList.contains('plus');
                
                let newVal = parseFloat(slider.value) + (isPlus ? step : -step);
                const isFloat = step < 1;
                const name = targetId.replace('ctrl-', '');

                updateLocalControl(name, newVal, isFloat);
            });
        });

        DOM.ctrlSys.oninput  = (e) => updateLocalControl('sys', e.target.value);
        DOM.ctrlDia.oninput  = (e) => {
            if (DOM.ctrlDbpSync.checked) DOM.ctrlDbpSync.checked = false;
            updateLocalControl('dia', e.target.value);
        };
        DOM.ctrlHR.oninput   = (e) => updateLocalControl('hr', e.target.value);
        DOM.ctrlST.oninput   = (e) => updateLocalControl('st', e.target.value, true);
        DOM.ctrlSpO2.oninput = (e) => updateLocalControl('spo2', e.target.value);
        DOM.ctrlEtCO2.oninput= (e) => updateLocalControl('etco2', e.target.value);
        DOM.ctrlRR.oninput   = (e) => updateLocalControl('rr', e.target.value);
        DOM.ctrlBT.oninput   = (e) => updateLocalControl('bt', e.target.value, true);

        DOM.inSys.oninput   = (e) => updateLocalControl('sys', e.target.value);
        DOM.inDia.oninput   = (e) => {
            if (DOM.ctrlDbpSync.checked) DOM.ctrlDbpSync.checked = false;
            updateLocalControl('dia', e.target.value);
        };
        DOM.inHR.oninput    = (e) => updateLocalControl('hr', e.target.value);
        DOM.inST.oninput    = (e) => updateLocalControl('st', e.target.value, true);
        DOM.inSpO2.oninput  = (e) => updateLocalControl('spo2', e.target.value);
        DOM.inEtCO2.oninput = (e) => updateLocalControl('etco2', e.target.value);
        DOM.inRR.oninput    = (e) => updateLocalControl('rr', e.target.value);
        DOM.inBT.oninput    = (e) => updateLocalControl('bt', e.target.value, true);

        DOM.ctrlCleftDepth.oninput = (e) => { 
            state.cleftDepth = parseFloat(e.target.value); 
            DOM.inCleftDepth.value = state.cleftDepth; 
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({cleftDepth: state.cleftDepth}); 
        };

        DOM.ctrlDbpSync.addEventListener('change', (e) => {
            state.dbpSync = e.target.checked;
            if (state.dbpSync) {
                const curSys = parseInt(DOM.inSys.value) || state.sys;
                const autoDia = Math.max(20, Math.min(180, Math.round(curSys * 2 / 3)));
                DOM.inDia.value = autoDia;
                DOM.ctrlDia.value = autoDia;
            }
            updateActivePhaseVitalsIfSelected();
        });

        DOM.ctrlTWave.addEventListener('change', (e) => { 
            state.tWaveInverted = e.target.checked; 
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({tWaveInverted: state.tWaveInverted}); 
            checkAutoAlarms();
        });

        DOM.btnToggleST.addEventListener('click', () => {
            state.tWaveInverted = !state.tWaveInverted;
            DOM.ctrlTWave.checked = state.tWaveInverted;
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({tWaveInverted: state.tWaveInverted});
            checkAutoAlarms();
        });

        function toggleABPMode(isABP) {
            state.abpMode = isABP;
            DOM.ctrlABP.checked = state.abpMode; 
            if (state.abpMode) {
                DOM.labelWaveRR.innerText = "ABP";
                DOM.labelWaveRR.style.color = "#ff0000"; 
                DOM.labelNBPTitle.innerText = "ABP mmHg";
            } else {
                DOM.labelWaveRR.innerText = "Resp (RR)";
                DOM.labelWaveRR.style.color = "#cccccc"; 
                DOM.labelNBPTitle.innerText = "NBP mmHg (2.5mins)";
            }
            updateDisplay();
        }

        DOM.ctrlABP.addEventListener('change', (e) => {
            toggleABPMode(e.target.checked);
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({abpMode: state.abpMode});
        });

        DOM.ctrlSelfBreathing.addEventListener('change', (e) => {
            state.selfBreathing = e.target.checked;
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({ selfBreathing: state.selfBreathing });
        });
        
        DOM.labelNBPTitle.addEventListener('click', () => {
            toggleABPMode(!state.abpMode);
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({abpMode: state.abpMode});
        });

        DOM.ctrlRhythm.addEventListener('change', (e) => {
            state.rhythm = e.target.value;
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({rhythm: state.rhythm});
            checkAutoAlarms();
        });

        DOM.ctrlRhythm.addEventListener('wheel', (e) => {
            e.preventDefault();
            const dir = e.deltaY > 0 ? 1 : -1;
            let nextIndex = DOM.ctrlRhythm.selectedIndex + dir;
            if (nextIndex < 0) nextIndex = 0;
            if (nextIndex >= DOM.ctrlRhythm.options.length) nextIndex = DOM.ctrlRhythm.options.length - 1;
            DOM.ctrlRhythm.selectedIndex = nextIndex;
            state.rhythm = DOM.ctrlRhythm.value;
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({ rhythm: state.rhythm });
            checkAutoAlarms();
        }, { passive: false });

        DOM.ctrlEtco2Pattern.addEventListener('change', (e) => {
            state.etco2Pattern = e.target.value;
            updateDisplay();
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({ etco2Pattern: state.etco2Pattern });
        });

        DOM.ctrlEtco2Pattern.addEventListener('wheel', (e) => {
            e.preventDefault();
            const dir = e.deltaY > 0 ? 1 : -1;
            let nextIndex = DOM.ctrlEtco2Pattern.selectedIndex + dir;
            if (nextIndex < 0) nextIndex = 0;
            if (nextIndex >= DOM.ctrlEtco2Pattern.options.length) nextIndex = DOM.ctrlEtco2Pattern.options.length - 1;
            DOM.ctrlEtco2Pattern.selectedIndex = nextIndex;
            state.etco2Pattern = DOM.ctrlEtco2Pattern.value;
            updateDisplay();
            updateActivePhaseVitalsIfSelected();
            syncToFirebase({ etco2Pattern: state.etco2Pattern });
        }, { passive: false });

        DOM.btnPanelStart.addEventListener('click', () => {
            state.monitorStatus = 'running';
            syncToFirebase({ monitorStatus: 'running' });
            startMonitorLocal();
        });

        DOM.btnPanelStandby.addEventListener('click', () => {
            state = JSON.parse(JSON.stringify(DEFAULT_INITIAL_STATE));
            syncToFirebase(state);
            standbyMonitorLocal();
        });

        DOM.btnPanelMute.addEventListener('click', (e) => {
            e.stopPropagation();
            state.isMuted = !state.isMuted;
            syncToFirebase({ isMuted: state.isMuted });
            updateDisplay();
        });

        DOM.ctrlVolume.addEventListener('change', (e) => {
            state.volume = parseInt(e.target.value);
            syncToFirebase({ volume: state.volume });
        });

        DOM.ctrlVolume.addEventListener('wheel', (e) => {
            e.preventDefault();
            const step = 10;
            const delta = e.deltaY < 0 ? step : -step;
            let currentVol = parseInt(DOM.ctrlVolume.value) || 0;
            let newVol = Math.max(0, Math.min(100, currentVol + delta));
            
            DOM.ctrlVolume.value = String(newVol);
            state.volume = newVol;
            syncToFirebase({ volume: state.volume });
        }, { passive: false });

        function setupMonitorWheel(id, stateKey, min, max, step) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('wheel', function(e) {
                e.preventDefault();
                const direction = e.deltaY < 0 ? 1 : -1;
                let newValue = parseFloat(state[stateKey]) + (direction * step);
                if (step < 1) newValue = parseFloat(newValue.toFixed(1));

        function triggerManualAlarm(boxElement) {
            if (!boxElement) return;
            boxElement.classList.remove('alarm-active');
            void boxElement.offsetWidth;
            boxElement.classList.add('alarm-active');
            
            if (audioCtx && audioCtx.state === 'running' && !state.isMuted && (state.volume || 0) > 0) {
                const now = audioCtx.currentTime;
                const volRatio = (state.volume !== undefined ? state.volume : 100) / 100;

                if (alarmAudioBuffer) {
                    for (let i = 0; i < 3; i++) {
                        const source = audioCtx.createBufferSource();
                        source.buffer = alarmAudioBuffer;
                        const gainNode = audioCtx.createGain();
                        source.connect(gainNode);
                        gainNode.connect(audioCtx.destination);
                        gainNode.gain.setValueAtTime(volRatio * 2.0, now + i * 2.0);
                        source.start(now + i * 2.0);
                    }
                } else {
                    for (let i = 0; i < 3; i++) {
                        const startTime = now + i * 2.0;
                        const osc = audioCtx.createOscillator();
                        const gainNode = audioCtx.createGain();
                        osc.type = 'square'; 
                        osc.frequency.setValueAtTime(400, startTime);
                        osc.frequency.setValueAtTime(500, startTime + 0.1); 
                        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                        gainNode.gain.setValueAtTime(0, startTime);
                        gainNode.gain.linearRampToValueAtTime(0.5 * volRatio, startTime + 0.05);
                        gainNode.gain.linearRampToValueAtTime(0, startTime + 0.4); 
                        osc.start(startTime); osc.stop(startTime + 0.4);
                    }
                }
            }
            setTimeout(() => { boxElement.classList.remove('alarm-active'); }, 6000);
        }

        function playBeep() {
            if (!audioCtx || state.isMuted || state.rhythm === 'vf' || (state.volume || 0) <= 0) return; 
            const now = audioCtx.currentTime;
            const volRatio = (state.volume !== undefined ? state.volume : 100) / 100;

            if (ekgAudioBuffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = ekgAudioBuffer;
                const gainNode = audioCtx.createGain();
                
                let pitchRatio = 1.0;
                if (state.spo2 < 100) {
                    pitchRatio = Math.max(0.6, 1.0 - ((100 - state.spo2) * 0.015));
                }
                source.playbackRate.value = pitchRatio;

                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.setValueAtTime(volRatio * 2.5, now); 
                source.start(now);
            } else {
                const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator();
                const mainGain = audioCtx.createGain();

                let freq = 800 + (state.spo2 - 70) * (600 / 40);
                let baseFreq = Math.max(300, Math.min(1500, freq));

                osc1.frequency.setValueAtTime(baseFreq, now); osc1.type = 'sine'; 
                osc2.frequency.setValueAtTime(baseFreq * 0.498, now); osc2.type = 'triangle'; 

                osc1.connect(mainGain); osc2.connect(mainGain); mainGain.connect(audioCtx.destination);
                mainGain.gain.setValueAtTime(0, now);
                mainGain.gain.linearRampToValueAtTime(0.8 * volRatio, now + 0.02); 
                mainGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);

                osc1.start(now); osc2.start(now); osc1.stop(now + 0.2); osc2.stop(now + 0.2);
            }
        }

        let scanX = 0; const scanSpeed = 2.5; let lastYs = { ecg: 0, spo2: 0, etco2: 0, rr: 0 };
        let lastEtco2Cycle = -1;

        class CapnographyRenderer {
            static calculate(phase, pattern, cleftDepth, timeSec) {
                let v = 0;
                switch (pattern) {
                    case 'curare': {
                        const pStart = 0.25, pEnd = 0.75, rDur = 0.015, fDur = 0.015;
                        if (phase >= pStart && phase < pStart + rDur) {
                            v = (phase - pStart) / rDur;
                        } else if (phase >= pStart + rDur && phase <= pEnd) {
                            const pProg = (phase - (pStart + rDur)) / (pEnd - (pStart + rDur));
                            let basePlateau = 1.0 + pProg * 0.04;
                            if (pProg >= 0.45 && pProg <= 0.70) {
                                const cProg = (pProg - 0.45) / 0.25;
                                const dip = Math.sin(cProg * Math.PI) * (cleftDepth || 0.4);
                                v = Math.max(0.1, basePlateau - dip);
                            } else {
                                v = basePlateau;
                            }
                        } else if (phase > pEnd && phase <= pEnd + fDur) {
                            v = 1.04 * (1 - (phase - pEnd) / fDur);
                        } else {
                            v = 0;
                        }
                        break;
                    }
                    case 'ineffective': {
                        const cycle = Math.floor(timeSec);
                        const isMissed = (cycle % 3 === 2);
                        if (isMissed) {
                            if (phase >= 0.2 && phase < 0.4) {
                                v = Math.sin((phase - 0.2) / 0.2 * Math.PI) * 0.25;
                            } else {
                                v = 0;
                            }
                        } else {
                            if (phase >= 0.20 && phase < 0.24) {
                                v = -0.08 * Math.sin((phase - 0.20) / 0.04 * Math.PI);
                            } else if (phase >= 0.24 && phase < 0.26) {
                                v = (phase - 0.24) / 0.02;
                            } else if (phase >= 0.26 && phase <= 0.75) {
                                v = 1.0 + (phase - 0.26) * 0.05;
                            } else if (phase > 0.75 && phase <= 0.77) {
                                v = 1.03 * (1 - (phase - 0.75) / 0.02);
                            } else {
                                v = 0;
                            }
                        }
                        break;
                    }
                    case 'autotrigger': {
                        const pStart = 0.2, pEnd = 0.65;
                        if (phase >= pStart && phase < pStart + 0.02) {
                            v = (phase - pStart) / 0.02;
                        } else if (phase >= pStart + 0.02 && phase <= pEnd) {
                            v = 0.85 + Math.sin(timeSec * 30) * 0.03;
                        } else if (phase > pEnd && phase <= pEnd + 0.02) {
                            v = 0.85 * (1 - (phase - pEnd) / 0.02);
                        } else {
                            v = Math.abs(Math.sin(timeSec * 25)) * 0.04;
                        }
                        break;
                    }
                    case 'doubletrigger': {
                        if (phase >= 0.15 && phase < 0.40) {
                            const subP = (phase - 0.15) / 0.25;
                            if (subP < 0.1) v = subP / 0.1 * 0.8;
                            else if (subP < 0.8) v = 0.8;
                            else v = 0.8 * (1 - (subP - 0.8) / 0.2);
                        } else if (phase >= 0.42 && phase < 0.75) {
                            const subP2 = (phase - 0.42) / 0.33;
                            if (subP2 < 0.08) v = subP2 / 0.08 * 1.05;
                            else if (subP2 < 0.85) v = 1.05;
                            else v = 1.05 * (1 - (subP2 - 0.85) / 0.15);
                        } else {
                            v = 0;
                        }
                        break;
                    }
                    case 'fighting': {
                        if (phase >= 0.25 && phase < 0.27) {
                            v = (phase - 0.25) / 0.02;
                        } else if (phase >= 0.27 && phase <= 0.75) {
                            const prog = (phase - 0.27) / 0.48;
                            v = 1.0 + prog * 0.08 + Math.sin(phase * 40 * Math.PI) * 0.08;
                        } else if (phase > 0.75 && phase <= 0.77) {
                            v = 1.1 * (1 - (phase - 0.75) / 0.02);
                        } else {
                            v = 0;
                        }
                        break;
                    }
                    case 'sharkfin': {
                        if (phase >= 0.20 && phase <= 0.75) {
                            const prog = (phase - 0.20) / 0.55;
                            v = Math.pow(prog, 2.5) * 1.08;
                        } else if (phase > 0.75 && phase <= 0.78) {
                            v = 1.08 * (1 - (phase - 0.75) / 0.03);
                        } else {
                            v = 0;
                        }
                        break;
                    }
                    case 'normal':
                    default: {
                        const pStart = 0.25, pEnd = 0.75, rDur = 0.015, fDur = 0.015;
                        if (phase >= pStart && phase < pStart + rDur) {
                            v = (phase - pStart) / rDur;
                        } else if (phase >= pStart + rDur && phase <= pEnd) {
                            const pProg = (phase - (pStart + rDur)) / (pEnd - (pStart + rDur));
                            v = 1.0 + pProg * 0.04;
                        } else if (phase > pEnd && phase <= pEnd + fDur) {
                            v = 1.04 * (1 - (phase - pEnd) / fDur);
                        } else {
                            v = 0;
                        }
                        break;
                    }
                }
                return v;
            }
        }

        function drawWaveforms(timestamp) {
            const beepInterval = 60000 / state.hr;
            if (timestamp - lastBeepTime >= beepInterval) { playBeep(); lastBeepTime = timestamp; }

            scanX += scanSpeed; if (scanX >= canvases.ecg.width) scanX = 0;

            for (let key in ctxs) {
                const ctx = ctxs[key];
                if (!ctx) continue;
                
                const h = canvases[key].height;
                ctx.clearRect(scanX, 0, 15, h); ctx.beginPath();
                ctx.moveTo(scanX - scanSpeed, lastYs[key] || h / 2);

                let y = h / 2; const timeSec = timestamp / 1000;

                if (key === 'ecg') {
                    const beatDuration = 60 / state.hr; 
                    const phase = (timeSec % beatDuration) / beatDuration;
                    const beatIndex = Math.floor(timeSec / beatDuration);
                    const stOffset = state.st * 0.05; 
                    const rhythm = state.rhythm || 'normal';
                    let v = 0;
                    let baselineY = h * 0.7;

                    if (rhythm === 'vf') {
                        baselineY = h * 0.55;
                        v = Math.sin(timeSec * 22) * 0.35 + Math.cos(timeSec * 14) * 0.25 + Math.sin(timeSec * 35) * 0.15;
                    } 
                    else if (rhythm === 'vt') {
                        baselineY = h * 0.55;
                        let vtRate = Math.max(120, state.hr);
                        let vtPhase = (timeSec % (60 / vtRate)) / (60 / vtRate);
                        v = Math.sin(vtPhase * Math.PI * 2) * 0.65 - Math.sin(vtPhase * Math.PI * 4) * 0.15;
                    } 
                    else if (rhythm === 'afib') {
                        v = Math.sin(timeSec * 25) * 0.04 + Math.sin(timeSec * 15) * 0.02; 
                        if (phase >= 0.22 && phase < 0.24) v += 0.9;
                        else if (phase >= 0.24 && phase < 0.28) v += -0.2 + (phase - 0.24) * 5 * (stOffset + 0.2);
                        else if (phase >= 0.28 && phase <= 0.4) v += stOffset;
                        else if (phase > 0.4 && phase <= 0.55) {
                            const tAmp = (state.tWaveInverted ? -0.2 : 0.15) + (state.st * 0.04);
                            v += stOffset + Math.sin((phase - 0.4) * (Math.PI / 0.15)) * tAmp;
                        }
                    } 
                    else if (rhythm === 'aflutter') {
                        v = -0.12 * ((timeSec * 5) % 1.0);
                        if (phase >= 0.22 && phase < 0.24) v += 0.9;
                        else if (phase >= 0.24 && phase < 0.28) v += -0.2 + (phase - 0.24) * 5 * (stOffset + 0.2);
                        else if (phase >= 0.28 && phase <= 0.4) v += stOffset;
                        else if (phase > 0.4 && phase <= 0.55) {
                            const tAmp = (state.tWaveInverted ? -0.2 : 0.15) + (state.st * 0.04);
                            v += stOffset + Math.sin((phase - 0.4) * (Math.PI / 0.15)) * tAmp;
                        }
                    } 
                    else {
                        let isPVC = false;
                        if (rhythm === 'pvc' && (Math.sin(beatIndex * 123.45) > 0.8)) isPVC = true;
                        if (rhythm === 'bigeminy' && (beatIndex % 2 === 1)) isPVC = true;
                        if (rhythm === 'trigeminy' && (beatIndex % 3 === 2)) isPVC = true;

                        if (isPVC) {
                            if (phase >= 0.18 && phase < 0.25) v = -0.35 * Math.sin((phase - 0.18) * Math.PI / 0.07);
                            else if (phase >= 0.25 && phase < 0.35) v = 1.1 * Math.sin((phase - 0.25) * Math.PI / 0.1);
                            else if (phase >= 0.35 && phase <= 0.6) v = -0.35 * Math.sin((phase - 0.35) * Math.PI / 0.25);
                        } else {
                            if (phase > 0.1 && phase < 0.15) v = Math.sin((phase - 0.1) * 20 * Math.PI) * 0.15; 
                            else if (phase >= 0.22 && phase < 0.24) v = 0.95;  
                            else if (phase >= 0.24 && phase < 0.28) {
                                const sTrough = -0.2; const progress = (phase - 0.24) / 0.04;
                                if (progress < 0.5) v = 0.95 - (progress * 2) * (0.95 - sTrough);
                                else v = sTrough + ((progress - 0.5) * 2) * (stOffset - sTrough);
                            }
                            else if (phase >= 0.28 && phase <= 0.4) v = stOffset; 
                            else if (phase > 0.4 && phase <= 0.55) {
                                const baseTAmp = state.tWaveInverted ? -0.2 : 0.15; 
                                const tAmp = baseTAmp + (state.st * 0.04); 
                                const theta = (phase - 0.4) * (Math.PI / 0.15);
                                const smoothBaseline = stOffset * (1 + Math.cos(theta)) / 2;
                                v = smoothBaseline + Math.sin(theta) * tAmp;
                            }
                        }
                    }
                    y = baselineY - (v * h * 0.5); 
                    ctx.strokeStyle = '#00ff00';
                }
                else if (key === 'spo2') {
                    const beatDuration = 60 / state.hr; const phase = (timeSec % beatDuration) / beatDuration;
                    let v = 0;
                    if (phase < 0.3) v = Math.sin((phase / 0.3) * (Math.PI / 2)); 
                    else if (phase < 0.5) v = 1.0 - ((phase - 0.3) / 0.2) * 0.6; 
                    else v = 0.4 + Math.sin(((phase - 0.5) / 0.5) * Math.PI) * 0.2; 
                    y = h * 0.8 - (v * h * 0.6); ctx.strokeStyle = '#00ffff';
                }
                else if (key === 'etco2') {
                    const effRR = (state.etco2Pattern === 'autotrigger') ? state.rr * 2 : state.rr;
                    const respDuration = (60 / effRR) / 3;
                    const phase = (timeSec % respDuration) / respDuration;
                    const cycleIndex = Math.floor(timeSec / respDuration);

                    let v = 0;
                    if (state.selfBreathing) {
                        if (cycleIndex !== lastEtco2Cycle) {
                            lastEtco2Cycle = cycleIndex;
                            const pseudoRandom = Math.sin(cycleIndex * 99.17) * 10000;
                            const randomEtCO2 = 10 + Math.floor((pseudoRandom - Math.floor(pseudoRandom)) * 15);
                            DOM.valEtCO2.innerText = randomEtCO2;
                        }
                        const currentVal = parseInt(DOM.valEtCO2.innerText) || 18;
                        const breathNoise = Math.sin(cycleIndex * 14.3) * 0.15;
                        v = CapnographyRenderer.calculate(phase, state.etco2Pattern, state.cleftDepth, timeSec);
                        const amp = (currentVal / 80) * (1 + breathNoise * 0.2);
                        y = h * 0.92 - (v * h * 0.9 * amp);
                    } else {
                        if (DOM.valEtCO2.innerText != state.etco2) {
                            DOM.valEtCO2.innerText = state.etco2;
                        }
                        v = CapnographyRenderer.calculate(phase, state.etco2Pattern, state.cleftDepth, timeSec);
                        const amp = state.etco2 / 80;
                        y = h * 0.9 - (v * h * 0.98 * amp);
                    }
                    ctx.strokeStyle = '#ffffff';
                }
                else if (key === 'rr') {
                    if (state.abpMode) {
                        const beatDuration = 60 / state.hr; const phase = (timeSec % beatDuration) / beatDuration;
                        let v = 0;
                        if (phase < 0.15) v = Math.sin((phase / 0.15) * (Math.PI / 2));
                        else if (phase < 0.35) v = 1.0 - ((phase - 0.15) / 0.2) * 0.4; 
                        else if (phase < 0.45) v = 0.6 + Math.sin(((phase - 0.35) / 0.1) * Math.PI) * 0.1;
                        else v = 0.6 - ((phase - 0.45) / 0.55) * 0.5; 
                        y = h * 0.85 - (v * h * 0.7); ctx.strokeStyle = '#ff0000';
                    } else {
                        const respDuration = (60 / state.rr) / 3; const phase = (timeSec % respDuration) / respDuration;
                        const v = Math.sin(phase * 2 * Math.PI);
                        y = h * 0.5 - (v * h * 0.18); ctx.strokeStyle = '#cccccc';
                    }
                }
                ctx.lineWidth = 2; ctx.lineTo(scanX, y); ctx.stroke(); lastYs[key] = y;
            }
            animationId = requestAnimationFrame(drawWaveforms);
        }

        // ==========================================
        // 5. 드래그, 리사이즈 및 최소화
        // ==========================================
        let highestZ = 20;

        function makeDraggable(elmnt, handle) {
            let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;
            const targetHandle = handle || elmnt;

            targetHandle.addEventListener('pointerdown', dragStart);

            function dragStart(e) {
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                elmnt.style.zIndex = ++highestZ;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = elmnt.offsetLeft;
                initialTop = elmnt.offsetTop;

                window.addEventListener('pointermove', dragging);
                window.addEventListener('pointerup', dragEnd);
            }

            function dragging(e) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                elmnt.style.left = `${initialLeft + dx}px`;
                elmnt.style.top = `${initialTop + dy}px`;
            }

            function dragEnd() {
                window.removeEventListener('pointermove', dragging);
                window.removeEventListener('pointerup', dragEnd);
            }
        }

        function makeResizable(elmnt, resizer, lockAspectRatio = false, onResizeCallback = null) {
            let startX = 0, startY = 0, initialWidth = 0, initialHeight = 0;

            resizer.addEventListener('pointerdown', resizeStart);

            function resizeStart(e) {
                e.stopPropagation();
                elmnt.style.zIndex = ++highestZ;
                startX = e.clientX;
                startY = e.clientY;
                initialWidth = elmnt.offsetWidth;
                initialHeight = elmnt.offsetHeight;

                window.addEventListener('pointermove', resizing);
                window.addEventListener('pointerup', resizeEnd);
            }

            function resizing(e) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                
                let minW = 140;
                if (elmnt.id === 'controls') minW = 220;
                if (elmnt.id === 'monitor-wrapper') minW = 260;

                let newWidth = initialWidth + dx;
                if (newWidth < minW) newWidth = minW;

                elmnt.style.width = `${newWidth}px`;

                if (!lockAspectRatio) {
                    let newHeight = initialHeight + dy;
                    if (newHeight < 60) newHeight = 60;
                    elmnt.style.height = `${newHeight}px`;
                }

                if (onResizeCallback) onResizeCallback();
            }

            function resizeEnd() {
                window.removeEventListener('pointermove', resizing);
                window.removeEventListener('pointerup', resizeEnd);
                if (onResizeCallback) onResizeCallback();
            }
        }

        const monitorWrapper = document.getElementById('monitor-wrapper');
        const monitorHandle = document.getElementById('monitor-handle');
        const monitorResizer = document.getElementById('monitor-resizer');

        const controlsPanel = document.getElementById('controls');
        const controlsHeader = document.getElementById('controls-header');
        const controlsResizer = document.getElementById('controls-resizer');
        const controlsBody = document.getElementById('controls-body');
        const ctrlMinBtn = document.getElementById('ctrl-min-btn');

        const qrContainer = document.getElementById('qr-container');
        const qrHeader = document.getElementById('qr-header');
        const qrResizer = document.getElementById('qr-resizer');
        const qrBody = document.getElementById('qr-body');
        const qrMinBtn = document.getElementById('qr-min-btn');

        makeDraggable(monitorWrapper, monitorHandle);
        makeDraggable(controlsPanel, controlsHeader);
        makeDraggable(qrContainer, qrHeader);

        makeResizable(monitorWrapper, monitorResizer, true);
        makeResizable(controlsPanel, controlsResizer, false);
        makeResizable(qrContainer, qrResizer, false, () => {
            renderQRCode();
        });

        ctrlMinBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (controlsBody.style.display === 'none') {
                controlsBody.style.display = 'flex';
                controlsResizer.style.display = 'block';
                controlsPanel.style.height = 'auto';
                ctrlMinBtn.innerText = '−';
            } else {
                controlsBody.style.display = 'none';
                controlsResizer.style.display = 'none';
                controlsPanel.style.height = 'auto';
                ctrlMinBtn.innerText = '+';
            }
        });

        qrMinBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (qrBody.style.display === 'none') {
                qrBody.style.display = 'flex';
                qrResizer.style.display = 'block';
                qrContainer.style.height = 'auto';
                qrMinBtn.innerText = '−';
                renderQRCode();
            } else {
                qrBody.style.display = 'none';
                qrResizer.style.display = 'none';
                qrContainer.style.height = 'auto';
                qrMinBtn.innerText = '+';
            }
        });

        // 📱 모바일로 접속 시(컨트롤러 전용 모드가 아닐 때) QR 코드 창을 기본 최소화 상태로 시작 ('사진 2' 구현)
        if (window.innerWidth <= 768 && role !== 'controller') {
            qrBody.style.display = 'none';
            qrResizer.style.display = 'none';
            qrContainer.style.height = 'auto';
            qrMinBtn.innerText = '+';
        }
    </script>
</body>
</html>
